networks:
    1panel-network:
        external: true
services:
    homepage:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - PUID=1000
            - PGID=1000
            - HOMEPAGE_ALLOWED_HOSTS=${HOMEPAGE_ALLOWED_HOSTS}
            - TZ=${TIME_ZONE}
        image: ghcr.io/gethomepage/homepage:v1.4.0
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3000
        restart: always
        volumes:
            - ./config:/app/config
            - /var/run/docker.sock:/var/run/docker.sock
